# OpeniLink Hub，容器只监听 127.0.0.1:__PORT__
# 由仓库 .claude/skills/hub-deploy/nginx/site.conf 渲染，改动请改模板后重新安装
map $http_upgrade $hub_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    # 不加 http2：nginx < 1.25 的 http2 作用于整个 IP:443，会把同机所有站点一起切换。
    # 需要时参照该主机其他站点的 listen 参数保持一致。
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json text/plain image/svg+xml;

    # 控制台发送文件（服务端 multipart 上限 32 MB）
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 直接覆盖而不是追加，客户端自带的值无法伪造来源
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket：浏览器实时推送 /api/ws、渠道 /api/v1/channels/connect、
        # App /bot/v1/ws、扫码绑定状态 /api/bots/bind/status/*
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hub_connection_upgrade;
        # 长连接与 MCP 流式响应
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
